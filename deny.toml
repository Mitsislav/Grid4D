# cargo deny (https://embarkstudios.github.io/cargo-deny/): the licences,
# advisories, duplicate versions and sources Grid4D's dependencies may have.
# CI runs `cargo deny check`; see docs/reference/app-release.md.

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported but do not fail the check on their own;
# vulnerabilities do.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # ttf-parser (grid4d-text's glyph outlines) is unmaintained; moving to
    # skrifa is planned (IMPLEMENTATION_PLAN.md, Phase 14). No vulnerability.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained only; replacement planned" },
]

[licenses]
# Permissive licences only, plus the font and data licences egui and Unicode
# tables come with. Grid4D itself is MIT OR Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9
# MPL-2.0 is a file-level copyleft: fine for a crate used unmodified (its
# source stays on crates.io and its notice is in THIRD_PARTY_LICENSES.txt).
exceptions = [{ crate = "smartstring", allow = ["MPL-2.0"] }]

[licenses.private]
# The workspace's own crates are not published.
ignore = true

[bans]
# rapier3d brings glam 0.33 beside ours (IMPLEMENTATION_PLAN.md, D10), and
# the GPU and windowing stacks carry a few older versions: reported, allowed.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
