# cargo about (https://embarkstudios.github.io/cargo-about/): generates
# assets/THIRD_PARTY_LICENSES.txt from Cargo.lock with about.hbs (some
# licence files have CR line ends; they are removed):
#   cargo about generate --workspace --locked --offline --fail about.hbs | tr -d '\r' > assets/THIRD_PARTY_LICENSES.txt
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "MPL-2.0",
]
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }
