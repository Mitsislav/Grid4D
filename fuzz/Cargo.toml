[package]
name = "grid4d-fuzz"
description = "Fuzz targets for Grid4D (cargo fuzz, nightly): the .g4d loader, the mesh Boolean and the Spline Boolean."
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
grid4d-io = { path = "../crates/io" }
grid4d-geom = { path = "../crates/geom" }
glam = "0.34"

# Not part of the main workspace: built only by `cargo fuzz` (nightly).
[workspace]
members = ["."]

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "boolean"
path = "fuzz_targets/boolean.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spline_boolean"
path = "fuzz_targets/spline_boolean.rs"
test = false
doc = false
bench = false
