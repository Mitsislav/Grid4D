name: Release

# Packages for Windows, macOS and Linux (docs/reference/app-packaging.md).
# On a v* tag: the packages, their SHA-256 sums, a draft GitHub Release with
# the version's CHANGELOG.md section, and an itch.io upload when the
# BUTLER_API_KEY secret exists. Run by hand: the packages only, kept as
# workflow artifacts (a dry run).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      numeric: ${{ steps.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: The version, from Cargo.toml (and the tag, which must agree)
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not match the version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=${version%%-*}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows packages
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: The .zip and the .msi
        shell: pwsh
        run: |
          $name = "Grid4D-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force dist, $name | Out-Null
          Copy-Item target/release/grid4d.exe, LICENSE-MIT, LICENSE-APACHE, assets/THIRD_PARTY_LICENSES.txt $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          dotnet tool install --global wix --version 5.0.2
          wix build assets/windows/grid4d.wxs -arch x64 -d "Version=$env:NUMERIC" -d "Bin=$name" -o "dist/$name.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: dist/*

  macos:
    name: macOS package
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      NUMERIC: ${{ needs.version.outputs.numeric }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --locked --target aarch64-apple-darwin
      - run: cargo build --release --locked --target x86_64-apple-darwin
      - name: Grid4D.app (universal) in a .dmg
        run: |
          staging=staging
          app="$staging/Grid4D.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          lipo -create -output "$app/Contents/MacOS/grid4d" \
            target/aarch64-apple-darwin/release/grid4d target/x86_64-apple-darwin/release/grid4d
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHORT_VERSION@/$NUMERIC/" assets/macos/Info.plist \
            > "$app/Contents/Info.plist"
          cp assets/icon/grid4d.icns LICENSE-MIT LICENSE-APACHE assets/THIRD_PARTY_LICENSES.txt \
            "$app/Contents/Resources/"
          # Not signed with a certificate (R4); an ad-hoc signature keeps the
          # bundle consistent, which Apple silicon requires to run it.
          codesign --force --deep --sign - "$app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Grid4D -srcfolder "$staging" -ov -format UDZO \
            "dist/Grid4D-$VERSION-macos-universal.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*

  linux:
    name: Linux packages
    needs: version
    # An older system, so the binary runs on older ones too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux windowing dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: The .tar.gz and the AppImage
        run: |
          name="Grid4D-$VERSION-linux-x64"
          mkdir -p dist "$name"
          # The folder: the program, its launcher, MIME type and icons.
          cp target/release/grid4d assets/linux/grid4d.desktop assets/linux/grid4d.xml \
            LICENSE-MIT LICENSE-APACHE assets/THIRD_PARTY_LICENSES.txt "$name/"
          for size in 16 24 32 48 64 128 256 512; do
            mkdir -p "$name/icons/hicolor/${size}x${size}/apps"
            cp "assets/icon/png/$size.png" "$name/icons/hicolor/${size}x${size}/apps/grid4d.png"
          done
          mkdir -p "$name/icons/hicolor/scalable/apps"
          cp assets/icon/grid4d.svg "$name/icons/hicolor/scalable/apps/grid4d.svg"
          tar -czf "dist/$name.tar.gz" "$name"

          # The AppImage: the same pieces in an AppDir.
          appdir=Grid4D.AppDir
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/mime/packages" "$appdir/usr/share/applications"
          cp target/release/grid4d "$appdir/usr/bin/"
          cp -r "$name/icons" "$appdir/usr/share/"
          cp assets/linux/grid4d.xml "$appdir/usr/share/mime/packages/"
          cp assets/linux/grid4d.desktop "$appdir/usr/share/applications/"
          cp assets/linux/grid4d.desktop assets/icon/png/256.png "$appdir/"
          mv "$appdir/256.png" "$appdir/grid4d.png"
          ln -s usr/bin/grid4d "$appdir/AppRun"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool "$appdir" "dist/$name.AppImage"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: dist/*

  release:
    name: Draft GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: The release notes, from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            /^## / { if (found) exit; if (index($0, "[" version "]")) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: A draft release, published by hand after a look
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "Grid4D $VERSION" --notes-file notes.md dist/*

  itch:
    name: itch.io upload
    if: github.ref_type == 'tag'
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/download-artifact@v8
        if: env.BUTLER_API_KEY != ''
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Push with butler (skipped without the BUTLER_API_KEY secret)
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          for channel in windows mac linux; do
            case "$channel" in
              windows) file="dist/Grid4D-$VERSION-windows-x64.zip" ;;
              mac) file="dist/Grid4D-$VERSION-macos-universal.dmg" ;;
              linux) file="dist/Grid4D-$VERSION-linux-x64.tar.gz" ;;
            esac
            butler/butler push "$file" "mitsislav/grid4d:$channel" --userversion "$VERSION"
          done
